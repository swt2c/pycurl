name: CI-Linux

on:
  push:
    branches: [ master ]
    paths-ignore:
    - '.github/workflows/ci-macos.yml'
    - '.github/workflows/ci-windows.yml'
    - '.github/workflows/cibuildwheel.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
    - '.github/workflows/ci-macos.yml'
    - '.github/workflows/ci-windows.yml'
    - '.github/workflows/cibuildwheel.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,${{ github.event_name == 'pull_request' && 'read' || 'readwrite' }}"
    strategy:
      fail-fast: false
      matrix:
        # TEMP(pycurl#1066): trimmed to just the one vcpkg/manylinux job we need
        # for the OPENSSLDIR repro. Revert this whole TEMP block before merging.
        curl-version: ["vcpkg"]
        python-version: ["3.12"]
        include:
          - curl-version: "vcpkg"
            python-version: "3.12"
            cibw-build: "cp312-manylinux_x86_64"
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install libcurl4-gnutls-dev libgnutls28-dev
      if: matrix.curl-version == 'ubuntu'
    - name: Install dependencies
      if: matrix.curl-version == 'ubuntu'
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        sudo apt-get install vsftpd
    - name: Lint with flake8
      if: matrix.curl-version == 'ubuntu'
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    - name: Build
      if: matrix.curl-version == 'ubuntu'
      env:
        CFLAGS: -Werror
      run: python -m pip install . --group dev -v
    - name: Verify free-threaded import does not enable the GIL
      if: matrix.python-version == '3.14t' && matrix.curl-version == 'ubuntu'
      env:
        PYTHON_GIL: "0"
      run: |
        python -W error -c "import pycurl; print(pycurl.version)"
        python -c "import sys, pycurl; assert sys._is_gil_enabled() is False, 'pycurl import re-enabled the GIL'"
    - name: Test with pytest
      if: matrix.curl-version == 'ubuntu'
      env:
        PYCURL_VSFTPD_PATH: vsftpd
      run: make do-test
    - name: Build & test with cibuildwheel
      if: matrix.curl-version == 'vcpkg'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_TOKEN GITHUB_REPOSITORY_OWNER VCPKG_BINARY_SOURCES
        # TEMP(pycurl#1066): plant a hostile openssl.cnf at the confirmed real
        # OPENSSLDIR (/etc/ssl, per DEFAULT_CERT_DIR diagnostic). Per OpenSSL's
        # own docs (doc/man5/config.pod, "SSL Configuration"), a [system_default]
        # ssl_conf section IS applied to every SSL_CTX_new() in vanilla upstream
        # OpenSSL -- but *without* `config_diagnostics = 1` in the default
        # section, a config error there is silently ignored rather than fatal
        # (this is why our two prior attempts, missing that line, had zero
        # effect). With it set, an unresolvable Groups value should reproduce
        # the exact "could not create a context" failure from the issue.
        # Revert this whole TEMP block before merging.
        CIBW_BEFORE_TEST_LINUX: >-
          pip install flake8 -r requirements-dev.txt &&
          make -C {package}/tests/fake-curl/libcurl &&
          mkdir -p /etc/ssl &&
          printf 'openssl_conf = openssl_init\nconfig_diagnostics = 1\n[openssl_init]\nssl_conf = ssl_configuration\n[ssl_configuration]\nsystem_default = tls_system_default\n[tls_system_default]\nGroups = ThisGroupDoesNotExist\n' > /etc/ssl/openssl.cnf
        CIBW_TEST_COMMAND: >-
          python -c "import ctypes, glob, os, pycurl;
          pkgdir = os.path.dirname(pycurl.__file__);
          ext = glob.glob(os.path.join(pkgdir, '_pycurl*.so'))[0];
          lib = ctypes.CDLL(ext);
          lib.X509_get_default_cert_dir.restype = ctypes.c_char_p;
          lib.X509_get_default_cert_file.restype = ctypes.c_char_p;
          print('LINKED', pycurl.version);
          print('OPENSSL_CONF_ENV', repr(os.environ.get('OPENSSL_CONF')));
          print('DEFAULT_CERT_DIR', lib.X509_get_default_cert_dir());
          print('DEFAULT_CERT_FILE', lib.X509_get_default_cert_file());
          import io; b = io.BytesIO(); c = pycurl.Curl();
          c.setopt(c.URL, 'https://example.com'); c.setopt(c.WRITEDATA, b);
          c.perform(); print('PYCURL_SSL_OK', c.getinfo(c.RESPONSE_CODE))"
      run: |
        pip install cibuildwheel
        cibuildwheel --only ${{ matrix.cibw-build }}
